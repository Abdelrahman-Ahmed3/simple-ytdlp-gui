[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-ytdlp-gui"
version = "0.1.8"
description = "A desktop GUI frontend for yt-dlp."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.8,<7"]

[project.gui-scripts]
ytdlp-gui = "ytdlp_gui.app:main"

[tool.setuptools.packages.find]
include = ["ytdlp_gui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
